<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бронирование переговорных</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f5ef;
      --surface: #ffffff;
      --ink: #172024;
      --muted: #607077;
      --line: #d9dfdc;
      --primary: #17685d;
      --primary-dark: #0f4f47;
      --blue: #26577c;
      --amber: #c87921;
      --danger: #b23a35;
      --soft: #ecf3f1;
      --shadow: 0 14px 30px rgba(31, 38, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 28px clamp(16px, 4vw, 48px);
      background: #172024;
      color: #ffffff;
      border-bottom: 4px solid var(--primary);
    }

    .brand {
      min-width: 0;
    }

    .brand-kicker {
      margin: 0 0 4px;
      color: #a9c7c1;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 40px;
      line-height: 1.08;
    }

    h2 {
      font-size: 22px;
      line-height: 1.2;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #eaf4f1;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .user-switch {
      display: grid;
      gap: 6px;
      min-width: 190px;
      color: #cfe4df;
      font-size: 13px;
      font-weight: 700;
    }

    .user-switch select {
      min-height: 40px;
      border-color: rgba(255, 255, 255, 0.28);
      background: #ffffff;
      color: var(--ink);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--amber);
      flex: 0 0 auto;
    }

    .status-dot.ok {
      background: #57c082;
    }

    .status-dot.bad {
      background: #e15c55;
    }

    main {
      padding-bottom: 40px;
    }

    .band {
      padding: 28px clamp(16px, 4vw, 48px);
    }

    .band.alt {
      background: #eef1ed;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 390px) minmax(0, 1fr);
      gap: 24px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      gap: 24px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .tool-panel {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid #c9d2ce;
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 104, 93, 0.16);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(38px, 1fr));
      gap: 6px;
      border: 0;
      padding: 0;
      margin: 0;
    }

    .days legend {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .day-check {
      position: relative;
      min-width: 0;
    }

    .day-check input {
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    .day-check span {
      display: grid;
      place-items: center;
      min-height: 38px;
      border: 1px solid #c9d2ce;
      border-radius: 6px;
      background: #ffffff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .day-check input:checked + span {
      border-color: var(--primary);
      background: var(--soft);
      color: var(--primary-dark);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 10px 14px;
      color: #ffffff;
      background: var(--primary);
      font-weight: 800;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn.secondary {
      color: var(--blue);
      background: #eef5f8;
      border-color: #c7d8df;
    }

    .btn.secondary:hover {
      background: #e2eef3;
    }

    .btn.danger {
      background: var(--danger);
    }

    .btn.danger:hover {
      background: #912c28;
    }

    .message {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .message.good {
      color: var(--primary-dark);
    }

    .message.bad {
      color: var(--danger);
    }

    .rooms-grid,
    .bookings-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .room-item,
    .booking-item {
      display: grid;
      gap: 8px;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .room-item {
      text-align: left;
    }

    .room-item.active {
      border-color: var(--primary);
      box-shadow: inset 4px 0 0 var(--primary);
    }

    .room-title,
    .booking-title {
      color: var(--ink);
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 6px;
      padding: 2px 8px;
      background: #f1f4f2;
      color: #46565d;
      font-weight: 700;
    }

    .schedule-controls {
      display: grid;
      grid-template-columns: minmax(190px, 260px) minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 18px;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 10px;
    }

    .slot-btn {
      display: grid;
      gap: 6px;
      min-height: 72px;
      width: 100%;
      border: 1px solid #bed1cc;
      border-radius: 8px;
      background: #fbfffd;
      color: var(--ink);
      padding: 12px;
      text-align: left;
    }

    .slot-btn:hover {
      border-color: var(--primary);
      background: var(--soft);
    }

    .slot-time {
      font-size: 18px;
      font-weight: 900;
    }

    .slot-caption {
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 800;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 120px;
      border: 1px dashed #bac6c2;
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .booking-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .small-btn {
      min-height: 34px;
      border: 1px solid #d7b2af;
      border-radius: 6px;
      padding: 7px 10px;
      background: #fff6f5;
      color: var(--danger);
      font-size: 13px;
      font-weight: 800;
    }

    .small-btn:hover {
      background: #ffecea;
    }

    @media (max-width: 860px) {
      .topbar,
      .workspace,
      .columns,
      .schedule-controls {
        grid-template-columns: 1fr;
      }

      .topbar {
        display: grid;
      }

      .status-pill {
        justify-self: start;
      }
    }

    @media (max-width: 540px) {
      h1 {
        font-size: 30px;
      }

      .row,
      .days {
        grid-template-columns: 1fr 1fr;
      }

      .button-row,
      .booking-footer {
        display: grid;
      }

      .btn,
      .small-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <p class="brand-kicker">MVP</p>
      <h1>Бронирование переговорных</h1>
    </div>
    <div class="top-actions">
      <label class="user-switch">
        Активный пользователь
        <select id="activeUser">
          <option value="user1">Пользователь 1</option>
          <option value="user2">Пользователь 2</option>
        </select>
      </label>
      <div class="status-pill" aria-live="polite">
        <span class="status-dot" id="statusDot"></span>
        <span id="connectionStatus">Подключение</span>
      </div>
    </div>
  </header>

  <main>
    <section class="band">
      <div class="workspace">
        <form class="tool-panel" id="roomForm">
          <div class="panel-head">
            <h2>Комната</h2>
          </div>

          <div class="form-grid">
            <label>
              Название
              <input id="roomName" name="roomName" autocomplete="off" value="Переговорная A" required>
            </label>

            <label>
              Описание
              <textarea id="roomDescription" name="roomDescription">Проектор, доска, 8 мест</textarea>
            </label>

            <label>
              Вместимость
              <input id="roomCapacity" name="roomCapacity" type="number" min="1" value="8">
            </label>

            <fieldset class="days" id="daysGroup">
              <legend>Дни</legend>
              <label class="day-check"><input type="checkbox" value="1" checked><span>Пн</span></label>
              <label class="day-check"><input type="checkbox" value="2" checked><span>Вт</span></label>
              <label class="day-check"><input type="checkbox" value="3" checked><span>Ср</span></label>
              <label class="day-check"><input type="checkbox" value="4" checked><span>Чт</span></label>
              <label class="day-check"><input type="checkbox" value="5" checked><span>Пт</span></label>
              <label class="day-check"><input type="checkbox" value="6" checked><span>Сб</span></label>
              <label class="day-check"><input type="checkbox" value="7" checked><span>Вс</span></label>
            </fieldset>

            <div class="row">
              <label>
                Начало
                <input id="startTime" name="startTime" type="time" value="09:00" required>
              </label>
              <label>
                Конец
                <input id="endTime" name="endTime" type="time" value="18:00" required>
              </label>
            </div>

            <div class="button-row">
              <button class="btn" type="submit">Создать</button>
              <button class="btn secondary" type="button" id="refreshButton">Обновить</button>
            </div>

            <div class="message" id="formMessage" aria-live="polite"></div>
          </div>
        </form>

        <section class="tool-panel" aria-labelledby="scheduleTitle">
          <div class="panel-head">
            <h2 id="scheduleTitle">Расписание</h2>
          </div>

          <div class="schedule-controls">
            <label>
              Дата
              <input id="scheduleDate" type="date">
            </label>
            <label>
              Переговорная
              <select id="roomSelect"></select>
            </label>
            <button class="btn secondary" type="button" id="loadSlotsButton">Показать</button>
          </div>

          <div class="message" id="scheduleMessage" aria-live="polite"></div>
          <div class="slots-grid" id="slotsGrid"></div>
        </section>
      </div>
    </section>

    <section class="band alt">
      <div class="columns">
        <section aria-labelledby="roomsTitle">
          <div class="panel-head">
            <h2 id="roomsTitle">Переговорки</h2>
          </div>
          <div class="rooms-grid" id="roomsGrid"></div>
        </section>

        <section aria-labelledby="bookingsTitle">
          <div class="panel-head">
            <h2 id="bookingsTitle">Мои брони</h2>
          </div>
          <div class="bookings-list" id="bookingsList"></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const state = {
      adminToken: "",
      activeUser: "user1",
      userTokens: {
        user1: "",
        user2: ""
      },
      rooms: [],
      selectedRoomId: "",
      slots: [],
      bookings: [],
      busy: false
    };

    const dom = {
      connectionStatus: document.querySelector("#connectionStatus"),
      statusDot: document.querySelector("#statusDot"),
      activeUser: document.querySelector("#activeUser"),
      roomForm: document.querySelector("#roomForm"),
      roomName: document.querySelector("#roomName"),
      roomDescription: document.querySelector("#roomDescription"),
      roomCapacity: document.querySelector("#roomCapacity"),
      daysGroup: document.querySelector("#daysGroup"),
      startTime: document.querySelector("#startTime"),
      endTime: document.querySelector("#endTime"),
      refreshButton: document.querySelector("#refreshButton"),
      formMessage: document.querySelector("#formMessage"),
      scheduleDate: document.querySelector("#scheduleDate"),
      roomSelect: document.querySelector("#roomSelect"),
      loadSlotsButton: document.querySelector("#loadSlotsButton"),
      scheduleMessage: document.querySelector("#scheduleMessage"),
      slotsGrid: document.querySelector("#slotsGrid"),
      roomsGrid: document.querySelector("#roomsGrid"),
      bookingsList: document.querySelector("#bookingsList")
    };

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setConnection(status, kind) {
      dom.connectionStatus.textContent = status;
      dom.statusDot.className = "status-dot" + (kind ? " " + kind : "");
    }

    function setMessage(node, text, kind) {
      node.textContent = text;
      node.className = "message" + (kind ? " " + kind : "");
    }

    function tomorrowUTC() {
      const date = new Date(Date.now() + 24 * 60 * 60 * 1000);
      return date.toISOString().slice(0, 10);
    }

    function formatUTC(iso) {
      return new Intl.DateTimeFormat("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "UTC"
      }).format(new Date(iso));
    }

    function formatTimeUTC(iso) {
      return new Intl.DateTimeFormat("ru-RU", {
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "UTC"
      }).format(new Date(iso));
    }

    async function api(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (options.token) {
        headers.set("Authorization", "Bearer " + options.token);
      }
      if (options.body) {
        headers.set("Content-Type", "application/json");
      }

      const response = await fetch(path, {
        method: options.method || "GET",
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });

      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) {
        const error = new Error(data?.error?.message || "request failed");
        error.status = response.status;
        error.code = data?.error?.code || "ERROR";
        throw error;
      }

      return data;
    }

    async function login(role, user) {
      const data = await api("/dummyLogin", {
        method: "POST",
        body: user ? { role, user } : { role }
      });
      return data.token;
    }

    function activeUserToken() {
      return state.userTokens[state.activeUser];
    }

    function selectedDays() {
      return Array.from(dom.daysGroup.querySelectorAll("input:checked"))
        .map((input) => Number(input.value));
    }

    function roomById(id) {
      return state.rooms.find((room) => room.id === id);
    }

    function renderRooms() {
      if (state.rooms.length === 0) {
        dom.roomsGrid.innerHTML = '<div class="empty">Комнат пока нет</div>';
        dom.roomSelect.innerHTML = '<option value="">Нет комнат</option>';
        return;
      }

      dom.roomsGrid.innerHTML = state.rooms.map((room) => {
        const capacity = room.capacity ? `${room.capacity} мест` : "без вместимости";
        const description = room.description || "без описания";
        const active = room.id === state.selectedRoomId ? " active" : "";
        return `
          <button class="room-item${active}" type="button" data-room-id="${escapeHTML(room.id)}">
            <span class="room-title">${escapeHTML(room.name)}</span>
            <span class="meta">
              <span class="tag">${escapeHTML(capacity)}</span>
              <span>${escapeHTML(description)}</span>
            </span>
          </button>
        `;
      }).join("");

      dom.roomSelect.innerHTML = state.rooms.map((room) => {
        const selected = room.id === state.selectedRoomId ? " selected" : "";
        return `<option value="${escapeHTML(room.id)}"${selected}>${escapeHTML(room.name)}</option>`;
      }).join("");
    }

    function renderSlots() {
      if (!state.selectedRoomId) {
        dom.slotsGrid.innerHTML = '<div class="empty">Комната не выбрана</div>';
        return;
      }

      if (state.slots.length === 0) {
        dom.slotsGrid.innerHTML = '<div class="empty">Свободных слотов нет</div>';
        return;
      }

      dom.slotsGrid.innerHTML = state.slots.map((slot) => {
        const start = formatTimeUTC(slot.start);
        const end = formatTimeUTC(slot.end);
        return `
          <button class="slot-btn" type="button" data-slot-id="${escapeHTML(slot.id)}">
            <span class="slot-time">${escapeHTML(start)}-${escapeHTML(end)}</span>
            <span class="slot-caption">Свободно, UTC</span>
          </button>
        `;
      }).join("");
    }

    function renderBookings(items) {
      const activeBookings = items.filter((item) => item.booking.status === "active");
      if (activeBookings.length === 0) {
        dom.bookingsList.innerHTML = '<div class="empty">Активных броней нет</div>';
        return;
      }

      dom.bookingsList.innerHTML = activeBookings.map((item) => {
        const room = roomById(item.slot.roomId);
        const roomName = room ? room.name : "Переговорная";
        return `
          <article class="booking-item">
            <div class="booking-title">${escapeHTML(roomName)}</div>
            <div class="meta">
              <span class="tag">${escapeHTML(formatUTC(item.slot.start))}</span>
              <span>${escapeHTML(formatTimeUTC(item.slot.start))}-${escapeHTML(formatTimeUTC(item.slot.end))} UTC</span>
            </div>
            <div class="booking-footer">
              <span class="meta">${escapeHTML(item.booking.status)}</span>
              <button class="small-btn" type="button" data-cancel-id="${escapeHTML(item.booking.id)}">Отменить</button>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadRooms() {
      const data = await api("/rooms/list", { token: activeUserToken() });
      state.rooms = data.rooms || [];
      if (!state.selectedRoomId && state.rooms.length > 0) {
        state.selectedRoomId = state.rooms[0].id;
      }
      if (state.selectedRoomId && !roomById(state.selectedRoomId)) {
        state.selectedRoomId = state.rooms[0]?.id || "";
      }
      renderRooms();
    }

    async function loadSlots() {
      if (!state.selectedRoomId) {
        state.slots = [];
        renderSlots();
        return;
      }

      setMessage(dom.scheduleMessage, "Загружаю расписание", "");
      const data = await api(`/rooms/${state.selectedRoomId}/slots/list?date=${dom.scheduleDate.value}`, {
        token: activeUserToken()
      });
      state.slots = data.slots || [];
      renderSlots();
      setMessage(dom.scheduleMessage, `Свободных слотов: ${state.slots.length}`, "good");
    }

    async function loadBookings() {
      const data = await api("/bookings/my", { token: activeUserToken() });
      const bookings = data.bookings || [];
      const items = await Promise.all(bookings.map(async (booking) => {
        try {
          const slotData = await api(`/slots/${booking.slotId}`, { token: activeUserToken() });
          return { booking, slot: slotData.slot };
        } catch (error) {
          return null;
        }
      }));
      state.bookings = items.filter(Boolean);
      renderBookings(state.bookings);
    }

    async function refreshAll() {
      await loadRooms();
      await loadSlots();
      await loadBookings();
    }

    async function createRoomAndSchedule(event) {
      event.preventDefault();
      if (state.busy) {
        return;
      }

      const days = selectedDays();
      if (days.length === 0) {
        setMessage(dom.formMessage, "Выберите хотя бы один день", "bad");
        return;
      }

      state.busy = true;
      setMessage(dom.formMessage, "Создаю комнату", "");

      try {
        const capacityValue = Number(dom.roomCapacity.value);
        const payload = {
          name: dom.roomName.value.trim(),
          description: dom.roomDescription.value.trim() || null,
          capacity: Number.isFinite(capacityValue) && capacityValue > 0 ? capacityValue : null
        };

        const roomData = await api("/rooms/create", {
          method: "POST",
          token: state.adminToken,
          body: payload
        });

        const roomId = roomData.room.id;
        await api(`/rooms/${roomId}/schedule/create`, {
          method: "POST",
          token: state.adminToken,
          body: {
            roomId,
            daysOfWeek: days,
            startTime: dom.startTime.value,
            endTime: dom.endTime.value
          }
        });

        state.selectedRoomId = roomId;
        setMessage(dom.formMessage, "Комната и расписание созданы", "good");
        await refreshAll();
      } catch (error) {
        setMessage(dom.formMessage, `${error.code}: ${error.message}`, "bad");
      } finally {
        state.busy = false;
      }
    }

    async function bookSlot(slotId) {
      if (state.busy) {
        return;
      }

      state.busy = true;
      setMessage(dom.scheduleMessage, "Создаю бронь", "");

      try {
        await api("/bookings/create", {
          method: "POST",
          token: activeUserToken(),
          body: { slotId }
        });
        setMessage(dom.scheduleMessage, "Бронь создана", "good");
        await loadSlots();
        await loadBookings();
      } catch (error) {
        if (error.code === "SLOT_ALREADY_BOOKED") {
          setMessage(dom.scheduleMessage, "Слот уже занят, расписание обновлено", "bad");
          await loadSlots();
        } else {
          setMessage(dom.scheduleMessage, `${error.code}: ${error.message}`, "bad");
        }
      } finally {
        state.busy = false;
      }
    }

    async function cancelBooking(bookingId) {
      if (state.busy) {
        return;
      }

      state.busy = true;
      try {
        await api(`/bookings/${bookingId}/cancel`, {
          method: "POST",
          token: activeUserToken()
        });
        await loadSlots();
        await loadBookings();
      } catch (error) {
        setMessage(dom.scheduleMessage, `${error.code}: ${error.message}`, "bad");
      } finally {
        state.busy = false;
      }
    }

    function bindEvents() {
      dom.roomForm.addEventListener("submit", createRoomAndSchedule);
      dom.refreshButton.addEventListener("click", () => refreshAll().catch(showFatal));
      dom.loadSlotsButton.addEventListener("click", () => loadSlots().catch(showFatal));

      dom.roomSelect.addEventListener("change", async () => {
        state.selectedRoomId = dom.roomSelect.value;
        renderRooms();
        await loadSlots();
      });

      dom.scheduleDate.addEventListener("change", () => loadSlots().catch(showFatal));

      dom.activeUser.addEventListener("change", async () => {
        state.activeUser = dom.activeUser.value;
        setMessage(dom.scheduleMessage, `Активен ${dom.activeUser.selectedOptions[0].textContent}`, "good");
        await refreshAll();
      });

      dom.roomsGrid.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-room-id]");
        if (!button) {
          return;
        }

        state.selectedRoomId = button.dataset.roomId;
        renderRooms();
        await loadSlots();
      });

      dom.slotsGrid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-slot-id]");
        if (button) {
          bookSlot(button.dataset.slotId);
        }
      });

      dom.bookingsList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-cancel-id]");
        if (button) {
          cancelBooking(button.dataset.cancelId);
        }
      });
    }

    function showFatal(error) {
      setConnection("Ошибка", "bad");
      setMessage(dom.scheduleMessage, `${error.code || "ERROR"}: ${error.message}`, "bad");
    }

    async function init() {
      bindEvents();
      dom.scheduleDate.value = tomorrowUTC();

      try {
        const tokens = await Promise.all([
          login("admin"),
          login("user", "user1"),
          login("user", "user2")
        ]);
        state.adminToken = tokens[0];
        state.userTokens.user1 = tokens[1];
        state.userTokens.user2 = tokens[2];
        setConnection("API подключен", "ok");
        await refreshAll();
      } catch (error) {
        showFatal(error);
      }
    }

    init();
  </script>
</body>
</html>
